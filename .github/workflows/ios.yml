name: iOS Build (Simulator)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode versions
        run: ls /Applications | grep Xcode

      - name: Print schemes
        run: |
          xcodebuild -list

      - name: Build (Simulator)
        run: |
          # Replace these after you see output from "Print schemes"
          xcodebuild \
            -scheme "hello-world" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            build
