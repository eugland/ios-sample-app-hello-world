name: iOS Build (Device Archive)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode versions
        run: ls /Applications | grep Xcode

      - name: Print schemes
        run: xcodebuild -list

      - name: Archive (iPhone device)
        run: |
          set -euo pipefail

          SCHEME="hello-world"
          ARCHIVE_PATH="$PWD/build/${SCHEME}.xcarchive"

          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          echo "Archive created at:"
          ls -la "$ARCHIVE_PATH"

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-xcarchive
          path: build/*.xcarchive
